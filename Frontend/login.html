<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Tally</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script src="js/theme.js"></script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="../index.html?home">Tally</a>
  <button class="icon-btn theme-toggle" type="button" data-theme-toggle></button>
</header>
<main class="auth-wrap">
  <section class="auth-panel">
    <h1>Sign in to Tally</h1>
    <p class="sub">Sync your tasks across devices.</p>
    <button class="btn btn-secondary" type="button" id="google-btn">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="stroke:none"><path fill="#4285F4" d="M21.6 12.23c0-.68-.06-1.33-.17-1.96H12v3.7h5.39a4.6 4.6 0 0 1-2 3.02v2.5h3.23c1.89-1.74 2.98-4.3 2.98-7.26z"/><path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.43l-3.23-2.5c-.9.6-2.04.96-3.39.96-2.6 0-4.8-1.76-5.59-4.12H3.07v2.58A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.41 13.91a6 6 0 0 1 0-3.82V7.5H3.07a10 10 0 0 0 0 9z"/><path fill="#EA4335" d="M12 6c1.47 0 2.79.5 3.83 1.5l2.87-2.87A10 10 0 0 0 3.07 7.5l3.34 2.59C7.2 7.76 9.4 6 12 6z"/></svg>
      Sign in with Google</button>
    <div class="divider">or</div>
    <button class="btn btn-primary" type="button" id="guest-btn">Continue without account</button>
    <p class="note">Without an account, your tasks are saved in this browser only.</p>
  </section>
</main>
<script src="js/api.js"></script><script src="js/ui.js"></script>
<script>
document.getElementById('google-btn').addEventListener('click', function () {
  if (!Tally.Auth.loginWithGoogle()) UI.toast('Google sign-in turns on once the backend is connected.');
});
document.getElementById('guest-btn').addEventListener('click', function () {
  Tally.Auth.continueAsGuest(); location.href = 'dashboard.html';
});
</script>
</body>
</html>
